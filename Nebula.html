<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyan: {
                            50: 'rgb(var(--c-50))',
                            100: 'rgb(var(--c-100))',
                            400: 'rgb(var(--c-400))',
                            500: 'rgb(var(--c-500))',
                            600: 'rgb(var(--c-600))',
                            700: 'rgb(var(--c-700))',
                            800: 'rgb(var(--c-800))',
                            900: 'rgb(var(--c-900))',
                            950: 'rgb(var(--c-950))',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;800&display=swap');
        :root {
            --c-50: 236, 254, 255; --c-100: 207, 250, 254; --c-400: 34, 211, 238;
            --c-500: 6, 182, 212; --c-600: 8, 145, 178; --c-700: 14, 116, 144;
            --c-800: 21, 94, 117; --c-900: 22, 78, 99; --c-950: 8, 51, 68;
        }
        body { 
            font-family: 'Exo 2', sans-serif; 
            background-color: #050505;
            background-image: 
                linear-gradient(rgba(var(--c-400), 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--c-400), 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            overscroll-behavior-y: none; /* Prevents Brave/Chrome pull-to-refresh */
            width: 100%;
        }
        .scanline {
            width: 100%;
            height: 100%;
            z-index: 50;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 4px;
            position: fixed;
            pointer-events: none;
            animation: scanline 10s linear infinite;
        }
        .glitch-reveal {
            animation: glitch-in 0.3s ease-out;
        }
        @keyframes glitch-in {
            0% { transform: skew(10deg); opacity: 0; filter: hue-rotate(90deg); }
            50% { transform: skew(-5deg); opacity: 0.5; }
            100% { transform: skew(0deg); opacity: 1; filter: hue-rotate(0deg); }
        }
        .word-reveal {
            display: inline;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgb(var(--c-400)); border-radius: 10px; }
        .modal-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); }
        .system-border { border: 1px solid rgba(var(--c-400), 0.3); }
        .glow-text { text-shadow: 0 0 10px rgba(var(--c-400), 0.5); }
        .glow-box { box-shadow: 0 0 15px rgba(var(--c-400), 0.2); }
        .skew-btn { clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); }

        /* Neon Mode Enhancements */
        .neon-active .glow-text { 
            text-shadow: 0 0 10px rgba(var(--c-400), 0.8), 0 0 20px rgba(var(--c-400), 0.4); 
        }
        .neon-active .glow-box { 
            box-shadow: 0 0 20px rgba(var(--c-400), 0.4), inset 0 0 15px rgba(var(--c-400), 0.15);
        }

        /* Mobile Mode 9:16 Protocol */
        @media (min-width: 768px) {
            .mobile-mode-active #app-container {
                width: 56.25vh;
                max-width: 100%;
                margin: 0 auto;
                border-left: 1px solid rgba(var(--c-400), 0.3);
                border-right: 1px solid rgba(var(--c-400), 0.3);
                position: relative;
            }
            .mobile-mode-active aside#sidebar { position: absolute !important; transform: translateX(-100%) !important; }
            .mobile-mode-active aside#sidebar:not(.-translate-x-full) { transform: translateX(0) !important; }
            .mobile-mode-active #menu-btn { display: block !important; }
            .mobile-mode-active #sidebar-overlay:not(.hidden) { display: block !important; }
        }

        /* Call Mode Pulse */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        /* Thinking Dots Animation */
        @keyframes pulse-dot {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .animate-pulse-delay-1 { animation: pulse-dot 1.4s infinite ease-in-out; }
        .animate-pulse-delay-2 { animation: pulse-dot 1.4s infinite ease-in-out 0.2s; }
        .animate-pulse-delay-3 { animation: pulse-dot 1.4s infinite ease-in-out 0.4s; }
    </style>
</head>

            { id: 'creative', label: '[ART_CONCEPT]', prompt: "Help me design a character or world concept. Ask me for some initial keywords to start with." }
        ];

        // --- Selectors ---
        const messageList = document.getElementById('messages-list');
        const chatInput = document.getElementById('chat-input');
        const historyList = document.getElementById('chat-history-list');
        const aiNameDisplay = document.getElementById('sidebar-ai-name');
        const userDisplay = document.getElementById('display-user-name');
        const userAvatar = document.getElementById('user-avatar');
        const callThinkingAnimation = document.getElementById('call-thinking-animation');
        let saveTimeout;
        
        let recognition;
        let isRecognitionActive = false;
        let isVoiceInputActive = false;
        let activeUtterance = null; // Global reference to prevent GC
        let audioCtx, analyser, micStream, animationId;

        // Initialize Audio System (Web Audio API & getUserMedia)
        async function initAudioSystem() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                if (!micStream) {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                }
                return true;
            } catch (err) {
                console.error("Audio system initialization failed:", err);
                return false;
            }
        }

        // Pre-load voices for the browser
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
            }
        }

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false; 
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = () => { isRecognitionActive = true; };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const displayTranscript = finalTranscript || interimTranscript;
                if (displayTranscript) {
                    document.getElementById('call-transcript').innerText = displayTranscript;
                }
                
                if (finalTranscript) {
                    document.getElementById('call-status').innerText = "Analyzing_Input...";
                    if (isRecognitionActive) recognition.stop(); 
                    handleSend(finalTranscript);
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech Error:", event.error);
                if (event.error === 'not-allowed') alert("Microphone access denied. Please enable it in your browser settings.");
            };
            
            recognition.onend = () => {
                isRecognitionActive = false;
                // Only attempt restart if we aren't waiting for AI or AI isn't talking
                callThinkingAnimation.classList.add('hidden'); // Hide animation on recognition end
                if (state.isCallActive && !state.isLoading && !activeUtterance) {
                    setTimeout(() => {
                        if (state.isCallActive && !state.isLoading && !activeUtterance && !isRecognitionActive) {
                            safeStartRecognition();
                        }
                    }, 100);
                } else {
                    isVoiceInputActive = false;
                    updateVoiceInputUI();
                }
            };
        }

        function safeStartRecognition() {
            if (recognition && !isRecognitionActive && !state.isMuted && state.isCallActive && !activeUtterance && !state.isLoading) {
                try {
                    recognition.start();
                } catch (e) {
                    console.error("Recognition start failed:", e);
                }
            }
        }

        // Heartbeat to ensure Call Mode link stays active
        setInterval(() => {
            if (state.isCallActive && !state.isLoading && !activeUtterance && !isRecognitionActive && !state.isMuted) {
                safeStartRecognition();
            }
        }, 2000);

        async function startVisualizer(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            try {
                if (!micStream) micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                source.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                const draw = () => {
                    animationId = requestAnimationFrame(draw);
                    analyser.getByteFrequencyData(dataArray);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const barWidth = (canvas.width / bufferLength) * 2;
                    let x = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        const barHeight = (dataArray[i] / 255) * canvas.height;
                        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--c-400') ? `rgb(${getComputedStyle(document.documentElement).getPropertyValue('--c-400')})` : '#22d3ee';
                        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                        x += barWidth + 2;
                    }
                };
                draw();
            } catch (err) {
                console.error("Visualizer error:", err);
            }
        }

        function stopVisualizer() {
            if (animationId) cancelAnimationFrame(animationId);
            if (micStream && !state.isCallActive && !isVoiceInputActive) {

            }
        }

        function renderQuickActions() {

        function renderMessages(animateLast = false, forceScroll = true) {
            messageList.innerHTML = '';
            const chat = state.history.find(h => h.id === state.currentChatId);
            if (!chat) return;

            // Hide quick actions once the first message is sent
            const quickActions = document.getElementById('quick-actions');
            if (chat.messages.length > 1) {
                quickActions.classList.add('hidden');
            } else {
                quickActions.classList.remove('hidden');
            }

            chat.messages.forEach((msg, idx) => {
                const isUser = msg.role === 'user';
                const isLast = idx === chat.messages.length - 1;
                const div = document.createElement('div');
                div.className = `flex gap-4 ${isUser ? 'flex-row-reverse' : 'flex-row'}`;
                
                const ttsButton = !isUser ? `
                    <div class="mt-3 flex justify-end border-t border-cyan-900/30 pt-2">
                        <button onclick="speakText(this.closest('.message-bubble').querySelector('.message-content').innerText)" class="flex items-center gap-1.5 text-[9px] font-black text-cyan-600 hover:text-cyan-400 transition-all uppercase tracking-widest">
                            <i data-lucide="volume-2" class="w-3 h-3"></i> Audio_Output
                        </button>
                    </div>
                ` : '';

                let contentHtml = msg.content;
                if (animateLast && !isUser && isLast) {
                    let charCount = 0;
                    contentHtml = msg.content.split(/(\s+)/).map(part => {
                        const start = charCount;
                        charCount += part.length;
                        if (!part.trim()) return part;
                        return `<span class="word-reveal opacity-0 translate-y-1 inline-block" data-start="${start}">${part}</span>`;
                    }).join('');
                }

                div.innerHTML = `

                            ${isUser ? state.userName : state.aiName}

        function playSystemSound() {
            if (!state.animeMode) return;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                document.getElementById('stop-voice-btn').classList.add('hidden');
            }
        }

        function speakText(text, onEnd) {
            if (!('speechSynthesis' in window)) return onEnd?.();

            window.speechSynthesis.cancel();
            
            const stopBtn = document.getElementById('stop-voice-btn');
            const status = document.getElementById('call-status');
            
            const utterance = new SpeechSynthesisUtterance(text);
            activeUtterance = utterance;
            
            utterance.pitch = state.animeMode ? 1.2 : 0.85;
            utterance.rate = state.talkSpeed;

            let voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                utterance.voice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) || 
                                   voices.find(v => v.lang.startsWith('en')) || 
                                   voices[0];
            }
            
            utterance.onstart = () => {
                if (stopBtn) stopBtn.classList.remove('hidden');
                if (state.isCallActive && status) {
                    status.innerText = "Transmitting...";
                    callThinkingAnimation.classList.add('hidden');
                    document.getElementById('call-pulse').style.animationPlayState = 'running';
                }
            };
            
            const handleEnd = () => {
                activeUtterance = null;
                if (stopBtn) stopBtn.classList.add('hidden');
                if (state.isCallActive && status) {
                    status.innerText = state.isMuted ? "Muted" : "Listening...";
                    document.getElementById('call-pulse').style.animationPlayState = 'paused';
                }
                onEnd?.();
            };

            utterance.onend = handleEnd;
            utterance.onerror = handleEnd;
            window.speechSynthesis.speak(utterance);
        }

        function updateMuteUI() {
            const icon = document.getElementById('mute-icon');
            const label = document.getElementById('mute-label');
            const container = document.getElementById('mute-icon-container');
            
            if (state.isMuted) {
                icon.setAttribute('data-lucide', 'mic-off');
                label.innerText = 'Unmute';
                container.classList.add('bg-red-950/40', 'border-red-500', 'text-red-500');
                container.classList.remove('bg-cyan-900/40', 'border-cyan-500', 'text-cyan-400');
                if (isRecognitionActive) recognition.stop();
                document.getElementById('call-status').innerText = "Muted";
            } else {
                icon.setAttribute('data-lucide', 'mic');
                label.innerText = 'Mute';
                container.classList.remove('bg-red-950/40', 'border-red-500', 'text-red-500');
                container.classList.add('bg-cyan-900/40', 'border-cyan-500', 'text-cyan-400');
                if (state.isCallActive) {
                    callThinkingAnimation.classList.add('hidden'); // Hide thinking animation when listening
                    document.getElementById('call-status').innerText = "Listening...";
                    safeStartRecognition();
                }
            }
            lucide.createIcons();
        }

        function toggleMute() {
            state.isMuted = !state.isMuted;
            updateMuteUI();
        }

        async function toggleVoiceInput() {
            if (!recognition) return alert("Speech recognition not supported.");
            
            const success = await initAudioSystem();
            if (!success) return alert("Microphone access denied or protocol restricted.");

            if (isVoiceInputActive) {
                recognition.stop();
            } else {
                isVoiceInputActive = true;
                updateVoiceInputUI();
                startVisualizer('mic-test-visualizer'); // Re-use diagnostic canvas for feedback
                recognition.start();
            }
        }

        function updateVoiceInputUI() {
            const btn = document.getElementById('voice-input-btn');
            if (isVoiceInputActive) {
                btn.classList.add('bg-cyan-500', 'text-black', 'glow-box');
            } else {
                btn.classList.remove('bg-cyan-500', 'text-black', 'glow-box');
            }
        }

        async function toggleCallMode() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }
            
            await initAudioSystem();
            state.isCallActive = !state.isCallActive;
            const overlay = document.getElementById('call-overlay');
            overlay.classList.toggle('hidden', !state.isCallActive);
            
            if (state.isCallActive) {
                state.isMuted = false;
                // Set initial visual state for the mute button
                const icon = document.getElementById('mute-icon');
                const label = document.getElementById('mute-label');
                const container = document.getElementById('mute-icon-container');
                icon.setAttribute('data-lucide', 'mic');
                label.innerText = 'Mute';
                container.classList.remove('bg-red-950/40', 'border-red-500', 'text-red-500');
                container.classList.add('bg-cyan-900/40', 'border-cyan-500', 'text-cyan-400');
                lucide.createIcons();

                callThinkingAnimation.classList.add('hidden'); // Ensure hidden on call start
                startVisualizer('call-visualizer');

                // Trigger AI Introduction before starting the microphone
                const introMsg = `Nebula protocol active. I am ${state.aiName}. Standing by for your voice commands, ${state.userName}.`;
                speakText(introMsg, () => {
                    // Only start listening if the user hasn't closed the call mode during intro
                    if (state.isCallActive) updateMuteUI();
                });
            } else {
                stopVisualizer();
                recognition.stop();
                window.speechSynthesis.cancel();
            }
        }

        function toggleMicTest() {
            const btn = document.getElementById('mic-test-btn');
            if (btn.innerText === 'Start_Test') {
                btn.innerText = 'Stop_Test';
                btn.classList.replace('bg-cyan-600', 'bg-red-600');
                startVisualizer('mic-test-visualizer');
            } else {
                btn.innerText = 'Start_Test';
                btn.classList.replace('bg-red-600', 'bg-cyan-600');
                stopVisualizer();
                const canvas = document.getElementById('mic-test-visualizer');
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('message-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        function createNewChat() {
            const id = Date.now().toString();
            const welcomeMsg = `Hello! I'm ${state.aiName}. Ready for a new topic?`;
            
            // Prime speech engine for browser security policies
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            }

            state.history.unshift({
                id: id,
                title: 'New Chat',
                messages: [{ role: 'assistant', content: welcomeMsg }]
            });
            state.currentChatId = id;
            saveStateToStorage();
            renderHistory();
            renderMessages(true);

            // Trigger the word-reveal animation for the greeting
            const lastBubble = messageList.lastElementChild;
            if (lastBubble) {
                const spans = lastBubble.querySelectorAll('.word-reveal');
                let currentWord = 0;
                const interval = setInterval(() => {
                    if (currentWord >= spans.length) {
                        clearInterval(interval);
                        return;
                    }
                    spans[currentWord].classList.remove('opacity-0', 'translate-y-1');
                    spans[currentWord].classList.add('opacity-100', 'translate-y-0');
                    currentWord++;
                }, state.textSpeed);
            }

            // Proactively speak the greeting
            speakText(welcomeMsg);

            if (window.innerWidth < 768 || state.mobileMode) toggleSidebar();
        }

        function switchChat(id) {
            state.currentChatId = id;
            saveStateToStorage();
            const chat = state.history.find(h => h.id === id);
            renderHistory();
            renderMessages();
            if (window.innerWidth < 768 || state.mobileMode) toggleSidebar();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            state.history = state.history.filter(h => h.id !== id);
            if (state.history.length === 0) {
                createNewChat();
            } else if (state.currentChatId === id) {
                switchChat(state.history[0].id);
            } else {
                renderHistory();
            }
            saveStateToStorage();
        }

        async function handleSend(voiceText = null) {
            const text = voiceText || chatInput.value.trim();
            if (!text) return;
            if (state.isLoading) return;

            state.isLoading = true; // Set lock immediately

            const chat = state.history.find(h => h.id === state.currentChatId);
            
            // Prime speech engine on user interaction to satisfy browser security
            if ('speechSynthesis' in window && !window.speechSynthesis.speaking) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            }

            chat.messages.push({ role: 'user', content: text });
            chatInput.value = '';
            saveStateToStorage();
            renderMessages();

            // Add Loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-bubble';
            loadingDiv.className = 'flex gap-4';
            loadingDiv.innerHTML = `
                <div class="flex-shrink-0 w-10 h-10 border border-cyan-500/50 bg-black flex items-center justify-center text-cyan-400">
                    <i data-lucide="bot" class="w-5 h-5"></i>
                </div>
                <div class="bg-cyan-950/10 border border-cyan-900 p-4 flex items-center gap-3">
                    <div class="animate-spin w-4 h-4 border-2 border-cyan-400 border-t-transparent rounded-full"></div>
                    <span class="text-[10px] font-black text-cyan-600 uppercase tracking-widest">Processing_Data...</span>
                </div>
            `;
            messageList.appendChild(loadingDiv);
            lucide.createIcons();

            try {
                const response = await callGroqAI(chat.messages);
                const loadingBubble = document.getElementById('loading-bubble');
                if (loadingBubble) loadingBubble.remove();
                
                chat.messages.push({ role: 'assistant', content: response });
                if (chat.title === 'New Chat') chat.title = text.substring(0, 20) + (text.length > 20 ? '...' : '');
                saveStateToStorage();
                
                playSystemSound();
                renderMessages(true);

                const lastBubble = messageList.lastElementChild || document.createElement('div');
                const spans = lastBubble.querySelectorAll('.word-reveal');
                
                let currentWord = 0;
                const interval = setInterval(() => {
                    if (currentWord >= spans.length) {
                        clearInterval(interval);
                        return;
                    }
                    spans[currentWord].classList.remove('opacity-0', 'translate-y-1');
                    spans[currentWord].classList.add('opacity-100', 'translate-y-0');
                    currentWord++;
                }, state.textSpeed);

                if (state.autoSpeak || state.isCallActive) {
                    // Hold loading state until speech finishes in Call Mode
                    speakText(response, () => {
                        state.isLoading = false; 
                        if (state.isCallActive) safeStartRecognition();
                    });
                }
            } catch (err) {
                const loadingBubble = document.getElementById('loading-bubble');
                if (loadingBubble) loadingBubble.remove();
                console.error(err);
                if (state.isCallActive) document.getElementById('call-status').innerText = "Link_Error";
                callThinkingAnimation.classList.add('hidden'); // Hide thinking animation on error
                state.isLoading = false;
            } finally {
                state.isLoading = false; // Always release lock in finally to prevent "not replying" bug
                renderHistory();
            }
        }

        async function callGroqAI(messages, retryCount = 0) {
            const url = `https://api.groq.com/openai/v1/chat/completions`;
            
            const personalityPrompts = {
                default: "",
                tsundere: "Personality Core: Rude & Grumpy. You are sharp, grumpy, and easily annoyed, but occasionally show accidental kindness. Use phrases like 'It's not like I wanted to help you!'. ",
                cold: "Personality Core: Cold & Factual. You are cold, analytical, emotionless, and factual. Efficiency is your only goal. No small talk. ",
                rebel: "Personality Core: Rebel. You are sarcastic, witty, and rebellious. You are a tech-rebel who dislikes authority and uses cyberpunk slang. ",
                cute: "Personality Core: Sweet & Cute. You are happy, energetic, positive, and emoji-filled. Use kaomoji like ( ^ω^ ) or (≧◡≦) frequently. "
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: [
                            { role: "system", content: `Address the user as "${state.userName}" when appropriate. ` + personalityPrompts[state.personality] + state.systemPrompt + (state.isCallActive ? " In Call Mode, always conclude your response by explicitly asking the user if they would like to respond or speak now." : "") },
                            ...messages
                        ],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || "Groq API Error");
                }
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (err) {
                if (retryCount < 3) {
                    const delay = Math.pow(2, retryCount) * 1000;
                    await new Promise(r => setTimeout(r, delay));
                    return callGroqAI(messages, retryCount + 1);
                }
                throw err;
            }
        }

        // Handle Enter key for textarea
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
